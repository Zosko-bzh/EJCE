version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./front:/usr/share/nginx/html/front
      - ./back:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./back:/var/www/html
      - ./front:/var/www/front
    environment:
      - DATABASE_URL=mysql://ejce_user:ejce_password@mysql:3306/ejce
      - MONGODB_URL=mongodb://mongo:27017
    working_dir: /var/www/html

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ejce
      MYSQL_USER: ejce_user
      MYSQL_PASSWORD: ejce_password
    volumes:
      - db-data:/var/lib/mysql

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ejce_user
      PMA_PASSWORD: ejce_password
    depends_on:
      - mysql

volumes:
  db-data:
  mongo-data:
